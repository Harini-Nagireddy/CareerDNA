<!DOCTYPE html>
<html>
<head>
    <title>CareerDNA Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        h2 {
            color: #2c3e50;
        }

        h3 {
            color: #34495e;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        ul {
            line-height: 1.8;
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        button {
            padding: 10px 18px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1a252f;
        }

        select {
            padding: 8px;
            width: 250px;
        }
    </style>

</head>
<body>

<!-- ATS SCORE -->
<div class="box">
    <h2>📊 ATS Score: {{ ats_score }}</h2>
</div>

<!-- SKILLS DISPLAY -->
<div class="box">

    <h3>🧠 Your Extracted Skills</h3>

    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>

</div>

<!-- ROLE SELECTION -->
<div class="box">

<form action="/skill-gap" method="POST">

<h3>🎯 Select Target Role</h3>

<select name="role" required>
    <option value="Data Scientist">Data Scientist</option>
    <option value="Data Analyst">Data Analyst</option>
    <option value="Web Developer">Web Developer</option>
</select>

<!-- Hidden inputs to send skills -->
{% for skill in skills %}
<input type="hidden" name="skills" value="{{ skill }}">
{% endfor %}

<input type="hidden" name="education" value="{{ education }}">
<input type="hidden" name="projects" value="{{ projects }}">
<input type="hidden" name="experience" value="{{ experience }}">

<br><br>

<button type="submit">Analyze Skill Gap</button>

</form>

</div>

</body>
</html>
