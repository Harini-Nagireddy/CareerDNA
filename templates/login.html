<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerDNA – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 60%,#0f2744 100%);}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.13);
  border-radius:20px;padding:48px 40px;width:420px;box-shadow:0 24px 60px rgba(0,0,0,0.45);}
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{font-size:50px;display:block;margin-bottom:10px;}
.logo h1{color:#fff;font-size:26px;font-weight:800;letter-spacing:-0.5px;}
.logo p{color:rgba(255,255,255,0.45);font-size:13px;margin-top:5px;}
.field{margin-bottom:18px;}
label{display:block;color:rgba(255,255,255,0.65);font-size:13px;font-weight:500;margin-bottom:6px;}
input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;color:#fff;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border 0.2s;}
input:focus{border-color:rgba(99,179,237,0.7);}
input::placeholder{color:rgba(255,255,255,0.28);}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;
  border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:0.2s;margin-top:4px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(59,130,246,0.4);}
.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;
  padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;text-align:center;}
.bottom{text-align:center;margin-top:22px;color:rgba(255,255,255,0.4);font-size:13px;}
.bottom a{color:#60a5fa;text-decoration:none;font-weight:500;}
.bottom a:hover{color:#93c5fd;}
.divider{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:22px 0;}
.demo{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);}
.demo span{color:rgba(255,255,255,0.5);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">🧬</span>
    <h1>CareerDNA</h1>
    <p>AI-Powered Career Intelligence Platform</p>
  </div>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
  <hr class="divider">
  <div class="demo">Demo: <span>admin / password123</span> &nbsp;·&nbsp; <span>student / college2024</span></div>
  <div class="bottom" style="margin-top:16px;">Don't have an account? <a href="/signup">Sign Up</a></div>
</div>
</body>
</html>
